name: PromptOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  evaluate-prompts:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout llmops-common dependency
      uses: actions/checkout@v4
      with:
        repository: LLMOps-Studio/llmops-common
        path: llmops-common-src

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ./llmops-common-src
        pip install -e .[dev]

    - name: Run Regression Tests (Mocked LLM)
      run: |
        pytest tests/test_regression.py -v